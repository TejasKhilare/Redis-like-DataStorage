[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "kvstore"
dynamic = ["version"]
description = "A Redis-inspired distributed in-memory key-value datastore"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Tejas Khilare" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.8",
    "redis>=5.0",  # compatibility tests run the official client against kvstore
]
bench = [
    "matplotlib>=3.8",  # charts for docs/BENCHMARKS.md (python -m benchmarks.report)
]

[project.scripts]
kvstore = "kvstore.__main__:main"
kvstore-cli = "kvstore.cli:main"

[tool.hatch.version]
path = "src/kvstore/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/kvstore"]

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

# -------------------------------------------------------------- coverage
[tool.coverage.run]
source = ["kvstore"]
branch = true
omit = ["src/kvstore/__main__.py"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@abstractmethod",
    "if __name__ == .__main__.:",
]

# ------------------------------------------------------------------ ruff
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "."]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "N",        # pep8-naming
    "UP",       # pyupgrade
    "B",        # bugbear
    "SIM",      # simplify
    "ASYNC",    # async pitfalls
    "RUF",      # ruff-specific
    "PT",       # pytest style
]
ignore = ["B008"]  # FastAPI's Depends() in argument defaults is idiomatic

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PT018"]  # `assert x is not None and x.y` reads fine in tests

# ------------------------------------------------------------------ mypy
[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["kvstore", "benchmarks"]
plugins = ["pydantic.mypy"]
